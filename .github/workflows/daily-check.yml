name: Weekly Check

# 触发方式的演变：
# - 2026-08-18 前：每天定时。提交噪音大，且连续多天结果逐字相同。
# - 2026-08-18 起：只手动触发。结果 9/1 之后一停就是 12 天，没人记得跑。
# - 2026-09-14 起：每周一 01:00 UTC（北京时间 09:00）自动跑一次，仍可手动触发。
#   依据：停跑 12 天后复检，211 条仍 0 失效——条目烂得没那么快，每周足够。
#
# 对外文案一直写「定期复检」并标注最近一次复检日期，改成每周后依然准确。
# 不要写回「每天」：没在每天跑却这么写，就是虚假宣称，这是本项目最不能碰的红线。
# 文件名保持 daily-check.yml 不变，避免 README 徽章与外部链接失效。
on:
  schedule:
    - cron: "0 1 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install --quiet certifi pyyaml

      - name: Run daily check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/daily_check.py

      # daily_check.py 写数据是直接调 GitHub API（PUT contents），不碰本地文件，
      # 所以上面这步跑完之后，这台 runner 的本地检出还是旧内容，必须重新拉一次
      # 才能测到它刚刚实际推上去的东西。
      #
      # 更重要的原因：这次 push 用的是 secrets.GITHUB_TOKEN，按 GitHub 官方文档，
      # 用这个内置 token 触发的 push **不会**触发别的 workflow（防止套娃死循环）。
      # 也就是说 tests.yml 不会因为这次自动提交而跑——唯一能验证「今天自动写的东西
      # 没有弄坏什么」的地方，就是这里，在同一个 job 里自己测自己。
      - name: Pull what was just pushed
        run: git pull --ff-only origin main

      - name: Verify pushed state still passes tests
        working-directory: scripts
        env:
          GITHUB_TOKEN: dummy
        run: python -m unittest discover -s . -p "test_*.py" -v
