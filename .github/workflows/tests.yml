name: Tests

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install --quiet certifi pyyaml

      - name: Run test suite
        working-directory: scripts
        env:
          GITHUB_TOKEN: dummy
        run: python -m unittest discover -s . -p "test_*.py" -v
