</style></head><body><header class="wrap top"><a href="../">← 中文 AI Skills 库</a><span>LOCAL ONLY · NO UPLOAD</span></header><main><section class="wrap hero"><div><div class="eyebrow">兼容性不是一句“能用”</div><h1>填一次实测，<br>留一份可复核证据。</h1><p class="lead">把环境、自动触发和任务完成分开记录。页面只在你的浏览器里生成 JSON，不上传、不持久保存。</p></div><aside class="seal"><b>隐私优先</b><p>下载前会检查常见 Token、邮箱和私人路径；自动扫描不能替代人工阅读。</p></aside></section><section class="wrap layout"><form class="panel" id="report-form"><h2>01 / 实测记录</h2><div class="privacy"><b>请先脱敏</b>不要粘贴 Token、邮箱、私人目录或未公开业务数据。</div><div class="grid">
<label>客户端<select name="client"><option value="codex">Codex</option><option value="claude-code">Claude Code</option><option value="cursor">Cursor</option><option value="other">其他</option></select></label><label>版本<input name="version" required placeholder="0.x.x"></label><label>操作系统<input name="os" required placeholder="macOS / Windows / Linux"></label><label>Skill<input name="skill" required list="skills"><datalist id="skills"><option value="ai-learning-coach"><option value="book-digest-cn"><option value="bookkeeping-cn"><option value="chinese-design-md"><option value="chinese-lesson-plan"><option value="chinese-typography"><option value="chinese-web-themes"><option value="chinese-work-report"><option value="ecommerce-copywriting"><option value="github-readme-cn"><option value="guochao-visual-cn"><option value="guofeng-threejs"><option value="homework-tutor-cn"></datalist></label>
<label class="full">逐字任务<textarea name="task" required></textarea></label><label>任务是否点名 Skill<select name="named"><option value="no">没有</option><option value="yes">有</option><option value="unknown">不确定</option></select></label><label>模型执行环境<select name="environment" id="environment"><option value="ok">已开始执行</option><option value="blocked">开始前被阻断</option><option value="unknown">不确定</option></select></label><label>自动触发<select name="activation" id="activation"><option value="verified">已确认</option><option value="not-triggered">未触发</option><option value="unknown">不确定</option></select></label><label>最终状态<select name="completion" id="completion"><option value="completed">完成</option><option value="partial">部分完成</option><option value="waiting-input">等待输入</option><option value="failed">失败</option><option value="not-run">未执行</option><option value="unknown">不确定</option></select></label>
<label class="full">实际观察<textarea name="observed" required placeholder="发生了什么？不要只写“好用”。"></textarea></label><label class="full">不能外推的边界<textarea name="boundaries" required placeholder="例如：只测了一条任务，不能代表其他版本。"></textarea></label><label class="full">环境错误（仅阻断时必填）<textarea name="error" id="error"></textarea></label></div><div class="actions"><button type="submit">生成预览</button><button type="button" class="secondary" id="download">下载 JSON</button><button type="button" class="secondary" id="copy">复制 JSON</button></div><div class="status" id="status" role="status" aria-live="polite"></div></form><aside class="panel"><h2>02 / JSON 预览</h2><pre id="preview">填写左侧字段后生成。内容不会离开本页。</pre></aside></section></main><footer><div class="wrap"><a href="../method/">四层测试方法</a> · <a href="../schemas/compatibility-result.schema.json">JSON Schema</a> · <a href="../examples/compatibility-result.example.json">真实示例</a> · <a href="https://github.com/sanhuang520-ship-it/awesome-chinese-ai-tools/blob/main/CONTRIBUTING.md">提交说明</a></div></footer><script>
const form=document.querySelector('#report-form'),preview=document.querySelector('#preview'),status=document.querySelector('#status'),environment=document.querySelector('#environment'),activation=document.querySelector('#activation'),completion=document.querySelector('#completion'),errorField=document.querySelector('#error');let current=null;
const unsafe=[/\b(?:sk|ghp|github_pat)_[A-Za-z0-9_-]{8,}\b/i,/\bBearer\s+[A-Za-z0-9._~-]{8,}/i,/\b[A-Z0-9._%+-]+@[A-Z0-9.-]+\.[A-Z]{2,}\b/i,/\/(?:Users|home)\/[^/\s]+\//,/\b[A-Z]:\\Users\\[^\\\s]+\\/i];
const knownSkills=new Set([...document.querySelectorAll('#skills option')].map(option=>option.value));
function lines(value){return value.split(/\n+/).map(v=>v.trim()).filter(Boolean)}function syncBlock(){const blocked=environment.value==='blocked';if(blocked){activation.value='unknown';completion.value='not-run'}else if(completion.value==='not-run'){activation.value='unknown';completion.value='unknown'}activation.disabled=blocked;completion.disabled=blocked;errorField.required=blocked}environment.addEventListener('change',syncBlock);syncBlock();
function build(){if(!form.reportValidity())return null;const f=new FormData(form),now=new Date(),date=now.toISOString().slice(0,10),skill=f.get('skill').trim(),id=`${date}-${f.get('client')}-${skill}-${Math.random().toString(36).slice(2,8)}`;if(!knownSkills.has(skill)){status.textContent='请选择本仓库维护的 13 个 Skill 之一。';return null}const report={schemaVersion:1,id,recordedAt:now.toISOString(),sourceType:'community-report',client:{name:f.get('client'),version:f.get('version').trim(),os:f.get('os').trim()},skill,task:{verbatim:f.get('task').trim(),namedSkill:f.get('named')},environment:{status:f.get('environment')},activation:{status:activation.value,evidence:activation.value==='verified'?'提交者确认客户端读取了目标 Skill。':'提交者未确认客户端读取目标 Skill。'},completion:{status:completion.value,summary:lines(f.get('observed'))[0]},observed:lines(f.get('observed')),boundaries:lines(f.get('boundaries')),privacy:{scrubbed:true,containsSensitiveData:false}};if(report.environment.status==='blocked')report.environment.error=f.get('error').trim();const text=JSON.stringify(report,null,2);if(unsafe.some(pattern=>pattern.test(text))){status.textContent='发现可能的 Token、邮箱或私人路径，请脱敏后再生成。';return null}status.textContent='结构已生成；下载前请再人工检查一遍隐私。';preview.textContent=text;current=report;return report}
form.addEventListener('submit',e=>{e.preventDefault();build()});document.querySelector('#download').addEventListener('click',()=>{const r=build();if(!r)return;const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(r,null,2)+'\n'],{type:'application/json'}));a.download=r.id+'.json';a.click();URL.revokeObjectURL(a.href)});document.querySelector('#copy').addEventListener('click',async()=>{const r=build();if(!r)return;try{await navigator.clipboard.writeText(JSON.stringify(r,null,2));status.textContent='已复制；提交前仍需人工检查隐私。'}catch{status.textContent='复制失败，请从右侧手动选择。'}});
</script></body></html>
